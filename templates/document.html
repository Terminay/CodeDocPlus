{% extends "base.html" %}

{% block content %}
<div class="document-page">
  <p class="page-eyebrow">{{ current_document }}</p>
  <div class="document-heading">
    <h1>{{ document_title }}</h1>
    <a class="back-link" href="{{ url_for('index') }}">← All pages</a>
  </div>
  <div class="document-layout">
    <article class="markdown-body">{{ content|safe }}</article>
    {% if toc %}
    <aside class="toc-panel" aria-label="On this page">
      <p class="toc-title">On this page</p>
      <nav>
        {% for item in toc %}
        <a class="toc-link toc-level-{{ item.level }}" href="#{{ item.id }}">{{ item.title }}</a>
        {% endfor %}
      </nav>
    </aside>
    {% endif %}
  </div>
</div>
{% endblock %}
