{% extends "base.html" %}

{% block content %}
<div class="content-wrapper doc-content-wrapper">

  <!-- Breadcrumb -->
  <nav class="breadcrumb-nav" aria-label="Breadcrumb">
    <a href="{{ url_for('index') }}" class="breadcrumb-link">Home</a>
    <span class="breadcrumb-sep" aria-hidden="true">»</span>
    <span class="breadcrumb-current">{{ document_title }}</span>
  </nav>

  <div class="doc-layout">
    <!-- Article -->
    <article class="markdown-body">
      <h1 class="doc-page-title">{{ document_title }}</h1>
      {{ content|safe }}
    </article>

    <!-- ToC -->
    {% if toc %}
    <aside class="toc-panel" aria-label="On this page">
      <p class="toc-heading">On This Page</p>
      <nav>
        {% for item in toc %}
        <a class="toc-link toc-level-{{ item.level }}" href="#{{ item.id }}" data-toc-link>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </aside>
    {% endif %}
  </div>

</div>
{% endblock %}
