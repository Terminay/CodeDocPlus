<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="{{ theme.background }}">
    <title>{{ page_title }} — {{ site_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
    {% if custom_css %}
    <link rel="stylesheet" href="{{ url_for('custom_stylesheet') }}">
    {% endif %}
    <style>
      :root {
        --ink: {{ theme.text }};
        --paper: {{ theme.background }};
        --sheet: {{ theme.surface }};
        --accent: {{ theme.accent }};
        --muted: {{ theme.muted }};
        --rule: {{ theme.border }};
      }
    </style>
  </head>
  <body>
    <div class="scrim"></div>
    <div class="site-shell">
      <aside class="sidebar">
        <div class="sidebar-head">
          <a class="brand" href="{{ url_for('index') }}" aria-label="{{ site_title }} home">
            <span class="brand-name">{{ site_title }}<small>{{ tagline }}</small></span>
          </a>
          <button class="icon-only" data-sidebar-close aria-label="Close sidebar" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="sidebar-section">
          <label class="search-box">
            <span class="search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </span>
            <input id="document-search" type="search" placeholder="Search pages" autocomplete="off" aria-label="Filter documentation pages">
            <kbd>/</kbd>
          </label>
        </div>

        <div class="sidebar-overflow">
          <nav class="sidebar-section document-nav" aria-label="Documentation">
            <p class="section-label">Pages</p>
            {% for document in documents %}
            <a class="document-link{% if document.path == current_document|default('') %} is-current{% endif %}"
               href="{{ url_for('show_document', document=document.path) }}"
               data-document-link>{{ document.title }}</a>
            {% else %}
            <p class="nav-empty">No pages yet.</p>
            {% endfor %}
            <p class="search-empty" hidden>No matching pages.</p>
          </nav>
        </div>

        <div class="sidebar-footer">
          <button class="theme-toggle" data-theme-toggle aria-label="Toggle color theme">
            <svg class="toggle-icon toggle-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="toggle-icon toggle-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span class="toggle-label">System</span>
          </button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="topbar-left">
            <button class="menu-button" data-sidebar-open aria-label="Open sidebar">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
              Menu
            </button>
            <div class="breadcrumb">
              <span>{{ site_title }}</span>
              <span class="crumb-sep">/</span>
              <span class="crumb-current">{{ page_title }}</span>
            </div>
          </div>
          <div class="topbar-actions">
            <a class="topbar-link" href="{{ url_for('index') }}">All pages</a>
          </div>
        </header>

        {% block content %}{% endblock %}

        <footer class="page-footer">
          <span>{{ site_title }}</span>
          <span class="footer-line"></span>
          <span>Documentation</span>
        </footer>
      </main>
    </div>
    <script src="{{ url_for('static', filename='site.js') }}" defer></script>
  </body>
</html>
